<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f1e8"><title>Loopline</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell">
  <header><div class="brand"><span class="mark">⌁</span><span>LOOPLINE</span></div><button id="sound" class="icon" aria-label="Ton umschalten">♪</button></header>
  <section id="home" class="screen">
    <div class="eyebrow">DEIN KLEINER DENKRAUM</div><h1>Ein guter<br><em>Gedanke</em><span class="period">.</span></h1>
    <p class="intro">Drei kurze Rätsel für heute. Ein neuer Anfang für deinen Kopf.</p>
    <div class="date-row"><span id="today"></span><span id="streak">0 TAGE IN FOLGE</span></div>
    <button id="daily" class="primary"><span><small>TAGESRUNDE</small><strong id="daily-label">Heute spielen</strong></span><span class="arrow">↗</span></button>
    <button id="free" class="secondary"><span><small>WEITERSPIELEN</small><strong>Freies Training</strong></span><span class="arrow">→</span></button>
    <div class="footer-note"><span class="dot"></span> Ohne Konto · Ohne Zeitdruck · Offline</div>
  </section>
  <section id="game" class="screen hidden">
    <div class="topline"><button id="back" class="text-button">← Zurück</button><span id="round-label">TAGESRUNDE · 1 / 3</span></div>
    <div class="game-head"><div id="kind" class="eyebrow">01 / LINIE</div><h2 id="title"></h2><p id="instruction"></p></div>
    <div id="play-area"></div><div id="feedback" role="status" aria-live="polite"></div>
    <div class="game-actions"><button id="reset" class="text-button">↺ Neustart</button><button id="hint" class="text-button">Hinweis</button></div>
    <div class="progress" id="progress"></div>
  </section>
  <section id="result" class="screen hidden"><div class="result-art">✳</div><div class="eyebrow">RUNDE GESCHAFFT</div><h1 id="result-title">Gut<br><em>gedacht.</em></h1><p id="result-copy"></p><button id="result-next" class="primary"><span><small>WEITER</small><strong id="next-label">Nächstes Rätsel</strong></span><span class="arrow">→</span></button><button id="result-home" class="text-button">Zur Übersicht</button></section>
</main><script src="game.js"></script></body></html>
