plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.inchat.localmedia'
    compileSdk 36
    defaultConfig {
        applicationId 'com.inchat.localmedia'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        playtest {
            storeFile file('../playtest.jks')
            storePassword 'localmedia-test'
            keyAlias 'localmedia-playtest'
            keyPassword 'localmedia-test'
            // Controlled compatibility test for the phone's pre-install archive reader.
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.playtest }
        release { signingConfig signingConfigs.playtest; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}
dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
