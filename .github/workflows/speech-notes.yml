name: Build Speech Notes APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/speech-notes/**'
      - 'tooling/speech-notes/**'
      - '.github/workflows/speech-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speechnotes-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPEECHNOTES_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare migration-parity workspace
        run: |
          set -euo pipefail
          test -d apps/speech-notes/android
          rm -f SpeechNotes
          ln -s apps/speech-notes/android SpeechNotes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned whisper.cpp
        run: |
          set -euo pipefail
          rm -rf SpeechNotes/app/src/main/cpp/whispercpp
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp SpeechNotes/app/src/main/cpp/whispercpp

      - name: Apply migration-parity patch chain
        run: |
          set -euo pipefail
          for patch in \
            patch_speechnotes_whisper_timings.py \
            patch_speechnotes_benchmark_tab.py \
            patch_speechnotes_v150_runtime.py \
            patch_speechnotes_v170_cpu_lab.py \
            patch_speechnotes_v180_kleidiai_backend.py \
            patch_speechnotes_v180_encoder_lab.py \
            patch_speechnotes_v182_diagnostics.py \
            patch_speechnotes_v183_trigger_lab.py \
            patch_speechnotes_v184_recording_fix.py \
            patch_speechnotes_v185_runtime_session.py \
            patch_speechnotes_v190_streaming.py \
            patch_speechnotes_v200_diarization.py; do
            python3 "tooling/speech-notes/patches/$patch"
          done

      - name: Build host quantizer
        run: |
          set -euo pipefail
          rm -rf /tmp/whisper-host
          cmake -S SpeechNotes/app/src/main/cpp/whispercpp -B /tmp/whisper-host -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF -DGGML_VULKAN=OFF -DGGML_NATIVE=ON
          cmake --build /tmp/whisper-host --target whisper-quantize -j2
          test -x /tmp/whisper-host/bin/whisper-quantize

      - name: Prepare models
        run: |
          set -euo pipefail
          rm -rf SpeechNotes/app/src/main/assets/models SpeechNotes/app/src/main/assets/speaker
          mkdir -p SpeechNotes/app/src/main/assets/models SpeechNotes/app/src/main/assets/speaker
          curl -fL --retry 5 --retry-delay 5 -o SpeechNotes/app/src/main/assets/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -fL --retry 5 --retry-delay 5 -o SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          curl -fL --retry 5 --retry-delay 5 -o /tmp/ggml-large-v3-turbo.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
          curl -fL --retry 5 --retry-delay 5 -o SpeechNotes/app/src/main/assets/speaker/campplus_cn_en_common_200k.onnx https://huggingface.co/welcomyou/campplus-3dspeaker-200k-onnx/resolve/cf8f96b6ca0255d3af39bd12b41e49be955eefa6/campplus_cn_en_common_200k.onnx
          echo "a3733eda680ef76256db5fc5dd9de8629e62c5e7  SpeechNotes/app/src/main/assets/models/ggml-base-q5_1.bin" | sha1sum -c -
          echo "e050f7970618a659205450ad97eb95a18d69c9ee  SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q5_0.bin" | sha1sum -c -
          echo "dd1740aa1e1ffa3895f96aef2166b8af2bb2ad09c00769dd275ee36aef6a2a7f  SpeechNotes/app/src/main/assets/speaker/campplus_cn_en_common_200k.onnx" | sha256sum -c -

      - name: Quantize Turbo Q4_0
        run: |
          set -euo pipefail
          /tmp/whisper-host/bin/whisper-quantize /tmp/ggml-large-v3-turbo.bin SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin q4_0
          test "$(stat -c%s SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin)" -gt 300000000
          sha256sum SpeechNotes/app/src/main/assets/models/ggml-large-v3-turbo-q4_0.bin
          rm -f /tmp/ggml-large-v3-turbo.bin

      - name: Restore signing identity
        run: |
          set -euo pipefail
          base64 -d tooling/speech-notes/signing/showcase-release.jks.b64 > SpeechNotes/showcase-release.jks

      - name: Build signed release APK
        run: |
          set -euo pipefail
          (cd SpeechNotes && gradle --no-daemon :app:assembleRelease)

      - name: Android lint hard gate
        run: |
          set -euo pipefail
          (cd SpeechNotes && gradle --no-daemon :app:lintRelease)

      - name: Inspect APK
        run: |
          set -euo pipefail
          cd SpeechNotes
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk > /tmp/apk-files.txt
          grep -q 'libggml-cpu-android_armv9.0_1.so' /tmp/apk-files.txt
          grep -q 'libggml-cpu-android_armv9.0_1_kai.so' /tmp/apk-files.txt
          grep -q 'assets/models/ggml-large-v3-turbo-q4_0.bin' /tmp/apk-files.txt
          grep -q 'assets/speaker/campplus_cn_en_common_200k.onnx' /tmp/apk-files.txt
          grep -q 'libonnxruntime.so' /tmp/apk-files.txt
          ! grep -q 'libggml-vulkan.so' /tmp/apk-files.txt
          cp app/build/outputs/apk/release/app-release.apk ../SpeechNotes-2.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechNotes-v2.0.0-arm64
          path: SpeechNotes-2.0.0.apk
          compression-level: 0
          retention-days: 14

      - name: Publish migration-baseline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='speechnotes-v2.0.0-monorepo-baseline'
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpeechNotes-2.0.0.apk#SpeechNotes-2.0.0.apk --repo "$GITHUB_REPOSITORY" --target "$SPEECHNOTES_SOURCE_SHA" --title 'Speech Notes v2.0.0 – monorepo migration baseline' --notes 'Migration-parity build produced entirely from InChat-App-Development. Source was extracted from immutable Drone-Fieldtest commit f280ba1e6fa8d50ab4af863642c2eaf9a3dec231; Drone-Fieldtest is not used during this build.'
