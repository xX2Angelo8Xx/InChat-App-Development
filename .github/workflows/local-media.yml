name: Build Local Media APK
on:
  push:
    branches: [feat/local-media]
    paths: ['apps/local-media/**', 'tooling/local-media/**', '.github/workflows/local-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-media-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare pinned engine and playtest signing
        run: |
          bash tooling/local-media/prepare-engine.sh
          base64 --decode tooling/local-media/signing/playtest.jks.b64 > apps/local-media/android/playtest.jks
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, unit tests and Android lint
        working-directory: apps/local-media/android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:testReleaseUnitTest :app:lintRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline runtime checks on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/local-media/android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          APK=apps/local-media/android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/local-media-badging.txt
          grep -F "package: name='com.inchat.localmedia' versionCode='1' versionName='0.1.0'" /tmp/local-media-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/local-media-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/local-media-signing.txt
          EXPECTED=$(keytool -list -v -keystore apps/local-media/android/playtest.jks -storepass localmedia-test -alias localmedia-playtest | awk '/SHA256:/{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED" /tmp/local-media-signing.txt
          python3 tooling/local-media/inspect-apk.py "$APK"
          cp "$APK" LocalMedia-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalMedia-0.1.0
          path: LocalMedia-0.1.0.apk
          if-no-files-found: error
      - name: Publish validated playtest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=localmedia-v0.1.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh api repos/${{ github.repository }}/git/ref/tags/$TAG --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload "$TAG" LocalMedia-0.1.0.apk --clobber
          else
            gh release create "$TAG" LocalMedia-0.1.0.apk --target "$GITHUB_SHA" --prerelease --title 'Local Media 0.1.0 — Android playtest' --notes-file apps/local-media/RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'LocalMedia-0.1.0.apk'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-media-validation
          path: |
            apps/local-media/android/app/build/reports/
            apps/local-media/android/app/build/outputs/androidTest-results/
            /tmp/local-media-badging.txt
            /tmp/local-media-signing.txt
