name: Record Speech Notes CI result

on:
  workflow_run:
    workflows: ["Build Speech Notes APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record authoritative run state
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p .ci/speech-notes
          {
            echo "run_id=$RUN_ID"
            echo "head_sha=$HEAD_SHA"
            echo "conclusion=$CONCLUSION"
            echo "run_url=$RUN_URL"
            echo "recorded_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$CONCLUSION" != "success" ]; then
              echo
              echo "===== FAILED LOG TAIL ====="
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 180 || true
            fi
          } > .ci/speech-notes/latest-run.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/speech-notes/latest-run.txt
          git commit -m "[skip ci] Speech Notes CI: $CONCLUSION" || exit 0
          git push origin HEAD:main
