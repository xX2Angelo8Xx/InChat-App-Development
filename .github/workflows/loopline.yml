name: Loopline
on:
  push:
    paths:
      - 'apps/loopline/**'
      - '.github/workflows/loopline.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Puzzle generator checks
        run: node apps/loopline/tests/generators.test.js
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Android SDK
        run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build and lint
        working-directory: apps/loopline/android
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Inspect APK
        run: |
          test -s apps/loopline/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l apps/loopline/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/(index.html|game.js|style.css)'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apps/loopline/android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.inchat.loopline' versionCode='1' versionName='1.0.0'"
      - uses: actions/upload-artifact@v4
        with:
          name: Loopline-1.0.0-debug
          path: apps/loopline/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
